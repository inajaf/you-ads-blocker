# Managed AdVoid version for Google Play.
#
# This file is the single source of truth for the version your uploads ship
# with. Bumping a release is a one-line edit here — never hardcode
# versionCode/versionName in build.gradle.kts.
#
# Rules for a Play release (Google Play requires monotonically increasing
# versionCode across uploads):
#   - versionCode: integer. First upload = 1. Every subsequent upload MUST be
#     strictly greater than the last uploaded code, or Play rejects the AAB.
#     Bump +1 (or more) per upload.
#   - versionName: free-form user-facing string ("major.minor.patch"). Can stay
#     the same across uploads; bump it to match your release. Must only contain
#     characters from [0-9A-Za-z._-].
VERSION_CODE=2
VERSION_NAME=1.4.0
