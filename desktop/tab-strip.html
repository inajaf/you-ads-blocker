<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>AdVoid tabs</title>
    <style>
      :root {
        color-scheme: dark;
        --strip-bg: #0b0b0d;
        --strip-border: #222228;
        --tab-bg: #121216;
        --tab-active-bg: #1c1c22;
        --tab-hover-bg: #17171c;
        --tab-text: #b6b6c0;
        --tab-active-text: #f4f4f5;
        --accent: #ff4d4d;
        --dim: #6b6b74;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }

      #tabs::-webkit-scrollbar {
        display: none;
        background: var(--strip-bg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      #strip {
        display: flex;
        align-items: stretch;
        height: 100%;
        padding: 0 6px;
        border-bottom: 1px solid var(--strip-border);
        gap: 4px;
      }

      #tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }

      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 1 180px;
        min-width: 72px;
        height: 28px;
        padding: 0 6px 0 10px;
        border-radius: 7px;
        background: var(--tab-bg);
        color: var(--tab-text);
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        overflow: hidden;
      }

      .tab:hover {
        background: var(--tab-hover-bg);
      }

      .tab.active {
        background: var(--tab-active-bg);
        color: var(--tab-active-text);
        box-shadow: inset 0 0 0 1px var(--strip-border);
      }

      .tab .spinner {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid var(--dim);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }

      .tab .favicon {
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.85;
      }

      .tab .label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tab .close {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--dim);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .tab .close:hover {
        background: rgba(255, 77, 77, 0.18);
        color: #ff8a8a;
      }

      #new-tab {
        flex: 0 0 auto;
        align-self: center;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--dim);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      #new-tab:hover {
        background: var(--tab-hover-bg);
        color: var(--tab-text);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="strip" role="tablist" aria-label="Open tabs">
      <div id="tabs"></div>
      <button id="new-tab" title="New tab (Cmd/Ctrl+T)" aria-label="New tab">+</button>
    </div>
    <script src="tab-strip.js"></script>
  </body>
</html>
