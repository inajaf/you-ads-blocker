name: Desktop cross-platform build

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'desktop/**'
      - 'extension/**'
      - 'adblock/**'
      - 'assets/brand/**'
      - 'scripts/pack-extension.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS
            command: npm run dist:mac
            artifact_path: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/latest-mac.yml
              desktop/release/*.blockmap
          - os: windows-latest
            platform: Windows
            command: npm run dist:win
            artifact_path: |
              desktop/release/*.exe
              desktop/release/latest.yml
              desktop/release/*.blockmap
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: ${{ matrix.command }}

      - name: Publish update feed to GitHub release (macOS)
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'macos-14' }}
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq '.tagName')"
          echo "Publishing macOS update feed to release: ${tag}"
          cd release
          gh release upload "${tag}" \
            latest-mac.yml \
            AdVoid-1.0.0-*.dmg \
            AdVoid-1.0.0-*.zip \
            AdVoid-1.0.0-*.blockmap \
            --clobber

      - name: Publish update feed to GitHub release (Windows)
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest' }}
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq '.tagName')"
          echo "Publishing Windows update feed to release: ${tag}"
          cd release
          gh release upload "${tag}" \
            latest.yml \
            AdVoid-Setup-1.0.0.exe \
            *.blockmap \
            --clobber

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AdVoid-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error